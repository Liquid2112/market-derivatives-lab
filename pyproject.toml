[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "market-derivatives-lab"
version = "0.1.0"
description = "Read-only data layer that fetches and normalizes Polymarket and Kalshi prediction markets into one schema."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.setuptools]
packages = ["mdlab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
